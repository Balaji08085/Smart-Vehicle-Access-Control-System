<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Primary MCC Maroon Gradient -->
    <linearGradient id="mccMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C1C2B"/>
      <stop offset="50%" stop-color="#701A1A"/>
      <stop offset="100%" stop-color="#4A0C13"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="mccGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE079"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Golden Border -->
  <path d="M 64 6 L 118 24 C 118 84 94 114 64 124 C 34 114 10 84 10 24 Z" 
        fill="url(#mccMaroon)" stroke="url(#mccGold)" stroke-width="4.5" filter="url(#shadow)"/>

  <!-- Inner Gold Inset Line -->
  <path d="M 64 12 L 112 28 C 112 80 90 108 64 117 C 38 108 16 80 16 28 Z" 
        fill="none" stroke="url(#mccGold)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8"/>

  <!-- Central MCC Christian Cross in Pure Gold -->
  <g transform="translate(64, 52)">
    <!-- Vertical Beam -->
    <rect x="-5" y="-28" width="10" height="52" rx="2" fill="url(#mccGold)"/>
    <!-- Horizontal Crossbar -->
    <rect x="-20" y="-18" width="40" height="10" rx="2" fill="url(#mccGold)"/>
    <!-- Cross Inner Highlights -->
    <rect x="-3" y="-26" width="6" height="48" rx="1" fill="#FFF4C0" opacity="0.6"/>
    <rect x="-18" y="-16" width="36" height="6" rx="1" fill="#FFF4C0" opacity="0.6"/>
  </g>

  <!-- Open Book of Learning at Base of Cross -->
  <g transform="translate(64, 76)">
    <!-- Left Page -->
    <path d="M -22 0 Q -11 -4 0 2 L 0 16 Q -11 10 -22 14 Z" fill="#FFFFFF" stroke="url(#mccGold)" stroke-width="1.5"/>
    <!-- Right Page -->
    <path d="M 22 0 Q 11 -4 0 2 L 0 16 Q 11 10 22 14 Z" fill="#FFFFFF" stroke="url(#mccGold)" stroke-width="1.5"/>
    <!-- Book Spine -->
    <line x1="0" y1="2" x2="0" y2="16" stroke="#701A1A" stroke-width="2"/>
  </g>

  <!-- Top "MCC" Gold Banner Header -->
  <rect x="36" y="16" width="56" height="15" rx="7.5" fill="url(#mccGold)" stroke="#701A1A" stroke-width="1"/>
  <text x="64" y="27.5" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" 
        fill="#5C121E" text-anchor="middle" letter-spacing="1.5">MCC</text>

  <!-- Bottom SVACS Security Badge Accent -->
  <circle cx="64" cy="102" r="7" fill="url(#mccGold)" stroke="#4A0C13" stroke-width="1.5"/>
  <path d="M 61 102 L 63.5 104.5 L 67.5 99.5" fill="none" stroke="#5C121E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>