name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-app:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Web App APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Web App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVACS-Web-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-flutter-security-app:
    name: Build Flutter Security Scanner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd Security_app
          flutter pub get

      - name: Build Flutter Security App APK (Release)
        run: |
          cd Security_app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Security App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVACS-Security-Guard-App-APK
          path: Security_app/build/app/outputs/flutter-apk/app-release.apk
